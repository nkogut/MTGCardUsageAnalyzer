[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mtgo_decklist_analyzer"
description = "Highly specific search tools and scraper for discovering how and why Magic: the Gathering decks run specific cards in a given metagame."
readme = "README.md"
keywords = ["Magic: The Gathering", "MTG", "MTGO", "Deckbuilding"]
authors = [{name = "Nick Kogut", email="nkogut4444@gmail.com"}]

requires-python = ">=3.13"
dynamic = ["version"]

dependencies = [
    "requests>=2.32.2",
    "selenium>=4.21.0",
    "seleniumbase>=4.28.0",
    "tkcalendar>=1.6.1",
    "matplotlib==3.10.7",
    "pandas>=2.2.0",
    "numpy==2.3.0",
    "orjson>=3.10",
    "unidecode>=1.4.0",
    "pyarrow>=23.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pyright>=1.1.350",
]


[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # PEP 8 errors
    "W",    # PEP 8 warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplifications
    "C4",   # comprehensions
    "N",    # naming
    "ANN",  # type annotations
    "ARG",  # unused arguments
    "PL",   # pylint
    "RUF",  # ruff
    "PTH",  # pathlib
    "D",    # docstrings
    "RET",  # return statements
]

ignore = ["D100", "D104", "D107", "E731", "PLR0913", "PLR0917", "PLR2004", "UP015", "RUF012"]

dummy-variable-rgx = "^(_|_.*)$" # Recognize dummy vars like "_"

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true

[tool.pyright]
typeCheckingMode = "standard"
reportMissingImports = true
enableReachabilityAnalysis = true
reportUnusedVariable = true
reportDuplicateImport = true
reportConstantRedefinition = true
reportUnnecessaryIsInstance = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnusedExpression = true
reportUnnecessaryTypeIgnoreComment = true
reportMatchNotExhaustive = true
reportUnreachable = true
reportImplicitOverride = true
reportPrivateUsage = true
reportCallInDefaultInitializer = true
reportPropertyTypeMismatch = true

[tool.setuptools.packages.find]
where = ["src"]
